<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" >
<head>
	<title>Spring MVC Example</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
<meta charset="utf-8">
<title>Insert title here</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<p th:text="${erreur}"></p>
<form th:action="@{/save}" method="post">
<input type="text" placeholder="Entrez votre email" name="email">
<input type="text" placeholder="Entrez votre note" name="note">
<select name="personneId">
	<option th:each="p : ${personnes}" th:value="${p.id}" th:text="${p.prenom + ' ' + p.nom}"></option>
</select>
<input type="submit" value="Envoyer">
</form>
</body>
</html>
