<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" >
<head>
	<title>Spring MVC Example</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
   <h1>Liste des contacts</h1>
	<table border="2">
	<tr>
	<th>Email</th>
	<th>Note</th>
	<th>Personne</th>
	<th></th>
	<th></th>
	</tr>
	<tr th:each="contact: ${contacts}">
	<td th:text="${contact.email}" />
	<td th:text="${contact.note}" />
	<td th:text="${contact.personne.prenom + ' ' + contact.personne.nom}" />
	<td><a th:href="@{/modifierContact(email=${contact.email})}">Modifier</a></td>
	<td><a th:href="@{/deleteSave(email=${contact.email})}">Supprimer</a></td>
</tr>

	</table>
</body>
</html>
